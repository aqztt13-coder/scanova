[project]
name = "scanova"
version = "1.0.2"
description = "Scanova - Document Scanner, OCR, Translation, PDF Tools and Secure Vault"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ali Turki", email = "ali@example.com" }
]
dependencies = [
    "flet==1.1.2",
    "Pillow>=10.0.0",
    "pypdf>=5.0.0",
    "fpdf2>=2.8.0",
    "cryptography>=42.0.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
pdf-image = ["pymupdf>=1.24.0"]
camera = ["opencv-python>=4.10.0.84"]
barcode = ["zxing-cpp"]
full = ["pymupdf>=1.24.0", "opencv-python>=4.10.0.84", "zxing-cpp"]

[tool.flet]
org = "com.aliturki"
product = "Scanova"
company = "Softfire UI Clone"
copyright = "Copyright (C) 2026"

[tool.flet.ios]
info_plist = { NSCameraUsageDescription = "يحتاج التطبيق إلى صلاحية الكاميرا لمسح المستندات وأكواد QR.", NSPhotoLibraryUsageDescription = "يحتاج التطبيق إلى الوصول لمعرض الصور لاستيراد المستندات وتحويلها إلى PDF.", NSPhotoLibraryAddUsageDescription = "يحتاج التطبيق إلى صلاحية حفظ المستندات الممسوحة في جهازك." }
