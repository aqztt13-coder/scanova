name: Build iOS IPA (OCR Scanner Pro)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-ios-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flet & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]>=0.24.0" Pillow pypdf fpdf2 cryptography requests

      - name: Build Unsigned iOS Archive (.xcarchive) via Flet
        run: |
          flet build ipa --no-ios-signing --verbose || true

      - name: Package .app into Sideloadly-Ready .ipa
        run: |
          echo "Searching for generated Runner.app..."
          APP_PATH=$(find build -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Fallback: building directly via Flutter without codesign..."
            cd build/flutter || exit 1
            flutter build ios --release --no-codesign
            APP_PATH=$(find build/ios/iphoneos -name "Runner.app" | head -n 1)
            cd ../..
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r OCR_Scanner_Pro.ipa Payload

      - name: Upload Ready .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OCR-Scanner-Pro-iOS-IPA
          path: OCR_Scanner_Pro.ipa
