name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ios-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install Flet & Pure-Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flet==0.24.1" "packaging<24.0" pypdf requests

      - name: Build Unsigned iOS App via Flet
        run: |
          rm -f pyproject.toml
          echo "# Scanova" > README.md
          
          # كتابة requirements.txt بمكتبات Pure Python المتوافقة 100% مع iOS
          cat << 'EOF' > requirements.txt
          flet
          pypdf
          requests
          EOF

          # اعتراض أمر flutter build ipa وتحويله إلى بناء بدون توقيع (--no-codesign)
          REAL_FLUTTER=$(which flutter)
          mkdir -p "$HOME/custom_bin"
          cat << 'EOF' > "$HOME/custom_bin/flutter"
          #!/bin/bash
          if [[ "$1" == "build" && "$2" == "ipa" ]]; then
            echo "⚡ Intercepted 'flutter build ipa' -> Running unsigned 'flutter build ios --release --no-codesign'"
            if [ -f "ios/Runner/Info.plist" ]; then
              plutil -replace NSCameraUsageDescription -string "Camera permission for document and QR scanning" ios/Runner/Info.plist || true
              plutil -replace NSPhotoLibraryUsageDescription -string "Photo library access to import documents" ios/Runner/Info.plist || true
              plutil -replace NSPhotoLibraryAddUsageDescription -string "Permission to save scanned documents" ios/Runner/Info.plist || true
            fi
            exec REAL_FLUTTER_PATH build ios --release --no-codesign
          else
            exec REAL_FLUTTER_PATH "$@"
          fi
          EOF
          sed -i '' "s|REAL_FLUTTER_PATH|$REAL_FLUTTER|g" "$HOME/custom_bin/flutter"
          chmod +x "$HOME/custom_bin/flutter"
          export PATH="$HOME/custom_bin:$PATH"

          flet build ipa \
            --project "Scanova" \
            --description "Smart Document Scanner and PDF Tools" \
            --org "com.aliturki.scanova" \
            --verbose

      - name: Package Runner.app into Sideloadly-Ready Scanova.ipa
        run: |
          APP_PATH=$(find build -name "Runner.app" -o -name "*.app" | grep "iphoneos" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "❌ Could not find .app bundle!"
            exit 1
          fi

          echo "✅ Found compiled app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -q Scanova.ipa Payload
          ls -lh Scanova.ipa

      - name: Upload Ready .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scanova-iOS-IPA
          path: Scanova.ipa
